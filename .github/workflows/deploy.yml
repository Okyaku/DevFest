name: Deploy AI Closet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: devfest-513813
  REGION: asia-northeast1

jobs:
  deploy:
    name: Deploy web and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/198951283585/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@devfest-513813.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: npm ci
      # NEXT_PUBLIC_* values are compiled into the static export by Next.js.
      # Store the Firebase Web app configuration in repository secrets so the
      # production bundle is configured without committing a local .env file.
      - run: make deploy-web
        env:
          # These NEXT_PUBLIC_* values are embedded in the static bundle at build time.
          # Keep demo mode disabled so the production UI sends authenticated requests
          # to the deployed Cloud Run API.
          NEXT_PUBLIC_API_BASE_URL: https://ai-closet-api-198951283585.asia-northeast1.run.app
          NEXT_PUBLIC_DEMO_MODE: "false"
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      - run: make deploy-api
