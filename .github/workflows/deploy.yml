name: Deploy AI Closet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: devfest-513813
  REGION: asia-northeast1

jobs:
  deploy:
    name: Deploy web and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/198951283585/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@devfest-513813.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: npm ci
      - run: make deploy-web
      - run: make deploy-api
